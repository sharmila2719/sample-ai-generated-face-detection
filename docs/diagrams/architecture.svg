<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="1000" height="700" fill="#0f1117"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#e2e8f0">AI Image Detection Pipeline — Architecture</text>

  <!-- ── BROWSER ── -->
  <rect x="20" y="60" width="130" height="56" rx="8" fill="#1a1d27" stroke="#6366f1" stroke-width="1.5"/>
  <text x="85" y="83" text-anchor="middle" font-size="12" fill="#e2e8f0">🌐 Browser</text>
  <text x="85" y="100" text-anchor="middle" font-size="10" fill="#8892a4">CloudFront UI</text>

  <!-- ── CLOUDFRONT ── -->
  <rect x="200" y="60" width="130" height="56" rx="8" fill="#1a1d27" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="265" y="83" text-anchor="middle" font-size="12" fill="#e2e8f0">☁️ CloudFront</text>
  <text x="265" y="100" text-anchor="middle" font-size="10" fill="#8892a4">+ Lambda@Edge Auth</text>

  <!-- ── S3 WEB BUCKET ── -->
  <rect x="380" y="60" width="120" height="56" rx="8" fill="#1a1d27" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="83" text-anchor="middle" font-size="12" fill="#e2e8f0">🪣 S3 Web</text>
  <text x="440" y="100" text-anchor="middle" font-size="10" fill="#8892a4">Static Assets</text>

  <!-- ── API GATEWAY ── -->
  <rect x="200" y="160" width="160" height="60" rx="8" fill="#1a1d27" stroke="#22c55e" stroke-width="1.5"/>
  <text x="280" y="183" text-anchor="middle" font-size="12" fill="#e2e8f0">⚡ API Gateway</text>
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#8892a4">REST  /api/*  /health</text>

  <!-- ── S3 INTAKE BUCKET ── -->
  <rect x="20" y="160" width="130" height="60" rx="8" fill="#1a1d27" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="85" y="183" text-anchor="middle" font-size="12" fill="#e2e8f0">🪣 S3 Intake</text>
  <text x="85" y="200" text-anchor="middle" font-size="10" fill="#8892a4">ai-images-to-analyze</text>

  <!-- ── LAMBDA FUNCTIONS ── -->
  <!-- Detection Lambda -->
  <rect x="420" y="160" width="135" height="60" rx="8" fill="#1a1d27" stroke="#6366f1" stroke-width="1.5"/>
  <text x="487" y="183" text-anchor="middle" font-size="11" fill="#e2e8f0">λ Detection</text>
  <text x="487" y="200" text-anchor="middle" font-size="9" fill="#8892a4">POST /api/detect</text>

  <!-- Health Lambda -->
  <rect x="575" y="160" width="110" height="60" rx="8" fill="#1a1d27" stroke="#6366f1" stroke-width="1.5"/>
  <text x="630" y="183" text-anchor="middle" font-size="11" fill="#e2e8f0">λ Health</text>
  <text x="630" y="200" text-anchor="middle" font-size="9" fill="#8892a4">GET /health</text>

  <!-- S3-Event Lambda -->
  <rect x="20" y="260" width="130" height="60" rx="8" fill="#1a1d27" stroke="#6366f1" stroke-width="1.5"/>
  <text x="85" y="283" text-anchor="middle" font-size="11" fill="#e2e8f0">λ S3 Event</text>
  <text x="85" y="300" text-anchor="middle" font-size="9" fill="#8892a4">ObjectCreated trigger</text>

  <!-- Upload URL Lambda -->
  <rect x="700" y="160" width="120" height="60" rx="8" fill="#1a1d27" stroke="#6366f1" stroke-width="1.5"/>
  <text x="760" y="183" text-anchor="middle" font-size="11" fill="#e2e8f0">λ Upload URL</text>
  <text x="760" y="200" text-anchor="middle" font-size="9" fill="#8892a4">Presigned PUT URL</text>

  <!-- ── INLINE ORCHESTRATOR ── -->
  <rect x="200" y="270" width="440" height="200" rx="8" fill="#0f1117" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="420" y="293" text-anchor="middle" font-size="13" font-weight="bold" fill="#6366f1">InlineAgentOrchestrator — Detection Cascade</text>

  <!-- Cascade steps -->
  <rect x="215" y="305" width="110" height="36" rx="5" fill="#1a1d27" stroke="#f59e0b" stroke-width="1"/>
  <text x="270" y="322" text-anchor="middle" font-size="10" fill="#e2e8f0">① Rekognition</text>
  <text x="270" y="334" text-anchor="middle" font-size="9" fill="#8892a4">Celebrities</text>

  <rect x="335" y="305" width="100" height="36" rx="5" fill="#1a1d27" stroke="#f59e0b" stroke-width="1"/>
  <text x="385" y="322" text-anchor="middle" font-size="10" fill="#e2e8f0">② EXIF Check</text>
  <text x="385" y="334" text-anchor="middle" font-size="9" fill="#8892a4">Fast path</text>

  <rect x="445" y="305" width="110" height="36" rx="5" fill="#1a1d27" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="322" text-anchor="middle" font-size="10" fill="#e2e8f0">③ SageMaker</text>
  <text x="500" y="334" text-anchor="middle" font-size="9" fill="#8892a4">Pixel CNN</text>

  <rect x="565" y="305" width="65" height="36" rx="5" fill="#1a1d27" stroke="#22c55e" stroke-width="1"/>
  <text x="597" y="322" text-anchor="middle" font-size="10" fill="#e2e8f0">⑤ Face</text>
  <text x="597" y="334" text-anchor="middle" font-size="9" fill="#8892a4">Forensics</text>

  <!-- Vision row -->
  <rect x="215" y="355" width="135" height="36" rx="5" fill="#1a1d27" stroke="#22c55e" stroke-width="1"/>
  <text x="282" y="372" text-anchor="middle" font-size="10" fill="#e2e8f0">④a Haiku 4.5</text>
  <text x="282" y="384" text-anchor="middle" font-size="9" fill="#8892a4">1st-pass vision</text>

  <rect x="360" y="355" width="130" height="36" rx="5" fill="#1a1d27" stroke="#22c55e" stroke-width="1"/>
  <text x="425" y="372" text-anchor="middle" font-size="10" fill="#e2e8f0">④b Sonnet 4.6</text>
  <text x="425" y="384" text-anchor="middle" font-size="9" fill="#8892a4">2nd-opinion (parallel)</text>

  <rect x="500" y="355" width="120" height="36" rx="5" fill="#1a1d27" stroke="#ef4444" stroke-width="1"/>
  <text x="560" y="372" text-anchor="middle" font-size="10" fill="#e2e8f0">④c Opus 4.7</text>
  <text x="560" y="384" text-anchor="middle" font-size="9" fill="#8892a4">Tiebreaker</text>

  <!-- Phase B/C row -->
  <rect x="215" y="405" width="150" height="36" rx="5" fill="#1a1d27" stroke="#8892a4" stroke-width="1"/>
  <text x="290" y="422" text-anchor="middle" font-size="10" fill="#e2e8f0">⑥ Phase B Regions</text>
  <text x="290" y="434" text-anchor="middle" font-size="9" fill="#8892a4">Rekognition + crop Haiku</text>

  <rect x="375" y="405" width="130" height="36" rx="5" fill="#1a1d27" stroke="#8892a4" stroke-width="1"/>
  <text x="440" y="422" text-anchor="middle" font-size="10" fill="#e2e8f0">⑦ Phase C Specialist</text>
  <text x="440" y="434" text-anchor="middle" font-size="9" fill="#8892a4">SageMaker composite</text>

  <rect x="515" y="405" width="110" height="36" rx="5" fill="#1a1d27" stroke="#6366f1" stroke-width="1"/>
  <text x="570" y="422" text-anchor="middle" font-size="10" fill="#e2e8f0">⑧ Combine</text>
  <text x="570" y="434" text-anchor="middle" font-size="9" fill="#8892a4">Evidence → DynamoDB</text>

  <!-- ── AWS SERVICES ── -->
  <!-- DynamoDB -->
  <rect x="200" y="510" width="130" height="55" rx="8" fill="#1a1d27" stroke="#6366f1" stroke-width="1.5"/>
  <text x="265" y="533" text-anchor="middle" font-size="12" fill="#e2e8f0">🗄 DynamoDB</text>
  <text x="265" y="549" text-anchor="middle" font-size="9" fill="#8892a4">ai-detection-results</text>
  <text x="265" y="560" text-anchor="middle" font-size="9" fill="#8892a4">+ content-hash GSI</text>

  <!-- SNS -->
  <rect x="350" y="510" width="120" height="55" rx="8" fill="#1a1d27" stroke="#ef4444" stroke-width="1.5"/>
  <text x="410" y="533" text-anchor="middle" font-size="12" fill="#e2e8f0">📣 SNS</text>
  <text x="410" y="549" text-anchor="middle" font-size="9" fill="#8892a4">ai-detection-alerts</text>
  <text x="410" y="560" text-anchor="middle" font-size="9" fill="#8892a4">high-probability alerts</text>

  <!-- Secrets Manager -->
  <rect x="490" y="510" width="130" height="55" rx="8" fill="#1a1d27" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="555" y="533" text-anchor="middle" font-size="12" fill="#e2e8f0">🔐 Secrets Mgr</text>
  <text x="555" y="549" text-anchor="middle" font-size="9" fill="#8892a4">web-ui-password</text>
  <text x="555" y="560" text-anchor="middle" font-size="9" fill="#8892a4">HMAC session auth</text>

  <!-- KMS -->
  <rect x="640" y="510" width="110" height="55" rx="8" fill="#1a1d27" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="695" y="533" text-anchor="middle" font-size="12" fill="#e2e8f0">🔑 KMS</text>
  <text x="695" y="549" text-anchor="middle" font-size="9" fill="#8892a4">C2PA Verify Key</text>
  <text x="695" y="560" text-anchor="middle" font-size="9" fill="#8892a4">ECC_NIST_P256</text>

  <!-- CloudWatch -->
  <rect x="770" y="510" width="120" height="55" rx="8" fill="#1a1d27" stroke="#22c55e" stroke-width="1.5"/>
  <text x="830" y="533" text-anchor="middle" font-size="12" fill="#e2e8f0">📊 CloudWatch</text>
  <text x="830" y="549" text-anchor="middle" font-size="9" fill="#8892a4">Latency + Error</text>
  <text x="830" y="560" text-anchor="middle" font-size="9" fill="#8892a4">Alarms → SNS</text>

  <!-- Bedrock -->
  <rect x="760" y="270" width="200" height="100" rx="8" fill="#1a1d27" stroke="#6366f1" stroke-width="1.5"/>
  <text x="860" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#6366f1">Amazon Bedrock</text>
  <text x="860" y="312" text-anchor="middle" font-size="10" fill="#8892a4">Global Inference Profiles</text>
  <text x="860" y="330" text-anchor="middle" font-size="10" fill="#e2e8f0">Claude Haiku 4.5</text>
  <text x="860" y="346" text-anchor="middle" font-size="10" fill="#e2e8f0">Claude Sonnet 4.6</text>
  <text x="860" y="362" text-anchor="middle" font-size="10" fill="#e2e8f0">Claude Opus 4.7</text>

  <!-- SageMaker -->
  <rect x="760" y="390" width="200" height="80" rx="8" fill="#1a1d27" stroke="#22c55e" stroke-width="1.5"/>
  <text x="860" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#22c55e">SageMaker</text>
  <text x="860" y="430" text-anchor="middle" font-size="10" fill="#8892a4">Serverless Endpoints</text>
  <text x="860" y="448" text-anchor="middle" font-size="10" fill="#e2e8f0">Pixel CNN · AIGC · Specialist</text>
  <text x="860" y="462" text-anchor="middle" font-size="10" fill="#e2e8f0">ai-image-detector</text>

  <!-- ── ARROWS ── -->
  <!-- Browser → CloudFront -->
  <line x1="150" y1="88" x2="200" y2="88" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- CloudFront → S3 Web -->
  <line x1="330" y1="88" x2="380" y2="88" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- CloudFront → API GW -->
  <line x1="265" y1="116" x2="265" y2="160" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- API GW → Detection Lambda -->
  <line x1="360" y1="190" x2="420" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- API GW → Health Lambda -->
  <line x1="360" y1="190" x2="575" y2="190" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <!-- API GW → Upload Lambda -->
  <line x1="360" y1="190" x2="700" y2="190" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <!-- Detection Lambda → Orchestrator -->
  <line x1="487" y1="220" x2="420" y2="270" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- S3 Intake → S3 Event Lambda -->
  <line x1="85" y1="220" x2="85" y2="260" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- S3 Event Lambda → Orchestrator -->
  <line x1="150" y1="290" x2="200" y2="310" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Orchestrator → DynamoDB -->
  <line x1="420" y1="470" x2="300" y2="510" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Orchestrator → SNS -->
  <line x1="490" y1="470" x2="420" y2="510" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <!-- Orchestrator → Bedrock -->
  <line x1="640" y1="350" x2="760" y2="320" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Orchestrator → SageMaker -->
  <line x1="640" y1="420" x2="760" y2="430" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="620" width="960" height="60" rx="8" fill="#1a1d27" stroke="#2d3148" stroke-width="1"/>
  <text x="40" y="643" font-size="11" fill="#8892a4">Legend:</text>
  <line x1="100" y1="640" x2="130" y2="640" stroke="#6366f1" stroke-width="2"/>
  <text x="135" y="644" font-size="10" fill="#e2e8f0">Request / Data flow</text>
  <line x1="240" y1="640" x2="270" y2="640" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="644" font-size="10" fill="#e2e8f0">S3 / CloudFront</text>
  <line x1="370" y1="640" x2="400" y2="640" stroke="#22c55e" stroke-width="2"/>
  <text x="405" y="644" font-size="10" fill="#e2e8f0">Rekognition / SageMaker</text>
  <line x1="540" y1="640" x2="570" y2="640" stroke="#ef4444" stroke-width="2"/>
  <text x="575" y="644" font-size="10" fill="#e2e8f0">Alerts (async)</text>
  <rect x="665" y="634" width="12" height="12" rx="2" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="682" y="644" font-size="10" fill="#e2e8f0">Inline Orchestrator boundary</text>

  <text x="40" y="668" font-size="10" fill="#8892a4">Region: us-east-1 (deployed) | Bedrock: eu-west-1 (Global Inference Profiles) | SageMaker: serverless</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8892a4"/>
    </marker>
  </defs>
</svg>
